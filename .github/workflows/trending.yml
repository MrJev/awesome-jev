name: Trending

on:
  schedule:
    - cron: "30 3 * * *" # daily, after discovery at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  trending:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot stars and rewrite the trending table
        run: python scripts/trending.py

      - name: Commit the snapshot and the table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/stars.json data/stats.json
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Trending: refresh star snapshots, the weekly table, and the entry count"
          git push
